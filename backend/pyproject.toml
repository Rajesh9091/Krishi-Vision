[project]
name = "agri-vision-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "python-multipart",
    "transformers",
    "torch",
    "ultralytics",
    "pillow",
    "numpy",
    "scipy",
    "soundfile",
    "httpx",
    "faster-whisper",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
